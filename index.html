<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoss Collection - Joyería</title>
    <!-- Cargamos Tailwind CSS para un diseño moderno y rápido sin sufrir con CSS puro -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Encabezado / Navbar -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide text-amber-700">YOSS COLLECTION</h1>
            <span class="text-sm bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-medium">Catálogo Digital</span>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <p class="text-center text-gray-500 mb-8">Elige tus joyas favoritas y envíanos tu pedido directo por WhatsApp sin registros.</p>
        
        <!-- Aquí se cargarán las joyas automáticamente con JavaScript -->
        <div id="contenedor-joyas" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <p class="text-center col-span-full text-gray-400">Cargando colección brillante...</p>
        </div>
    </main>

    <!-- Lógica de programación en JavaScript -->
    <script>
        // CONFIGURACIÓN: Pon aquí tu número de WhatsApp real con el código de tu país (ej: 51 para Perú)
        const NUMERO_WHATSAPP = "51954525895"; 

        // Función que lee el archivo joyas.json que creaste en el paso anterior
        async function cargarJoyas() {
            try {
                const respuesta = await fetch('joyas.json');
                const joyas = await respuesta.json();
                const contenedor = document.getElementById('contenedor-joyas');
                contenedor.innerHTML = ''; // Limpiamos el texto de carga

                joyas.forEach(joya => {
                    // Creamos la tarjeta visual para cada joya
                    const tarjeta = document.createElement('div');
                    tarjeta.className = "bg-white rounded-lg shadow overflow-hidden border border-gray-100 hover:shadow-lg transition-shadow";
                    tarjeta.innerHTML = `
                        <img src="${joya.imagen}" alt="${joya.nombre}" class="w-full h-64 object-cover">
                        <div class="p-4">
                            <span class="text-xs font-semibold text-amber-600 uppercase tracking-wider">${joya.material}</span>
                            <h3 class="text-lg font-bold text-gray-900 mt-1">${joya.nombre}</h3>
                            <p class="text-gray-500 text-sm mt-1 h-12 overflow-hidden">${joya.descripcion}</p>
                            <div class="flex items-center justify-between mt-4 pt-4 border-t border-gray-50">
                                <span class="text-xl font-extrabold text-gray-900">S/ ${joya.precio.toFixed(2)}</span>
                                <button onclick="enviarWhatsApp('${joya.nombre}', ${joya.precio})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded transition-colors text-sm flex items-center gap-1">
                                    Pedir por WhatsApp
                                </button>
                            </div>
                        </div>
                    `;
                    contenedor.appendChild(tarjeta);
                });
            } catch (error) {
                console.error("Error cargando las joyas:", error);
            }
        }

        // Función que arma el mensaje y redirige al cliente a tu WhatsApp sin instalar nada
        function enviarWhatsApp(nombreJoya, precioJoya) {
            const mensaje = encodeURIComponent(¡Hola Yoss Collection! Me interesa adquirir la siguiente pieza:\n\n✨ *${nombreJoya}*\n💰 Precio: S/ ${precioJoya.toFixed(2)}\n\n¿Está disponible?);
            window.open(https://wa.me{NUMERO_WHATSAPP}?text=${mensaje}, '_blank');
        }

        // Ejecutamos la función al cargar la página
        cargarJoyas();
    </script>
</body>
</html>
