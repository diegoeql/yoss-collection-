<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoss Collection - Joyería</title>
    <style>
       /* Estilos elegantes para la barra de categorías */
.filtros-genero {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 20px 0 35px 0;
}

.btn-filtro {
  background-color: #ffffff;
  color: #333333;
  border: 1px solid #dddddd;
  padding: 8px 20px;
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-filtro:hover {
  background-color: #f5f5f5;
}

/* Cuando el botón esté seleccionado, toma un tono dorado elegante */
.btn-filtro.activo {
  background-color: #b89742; 
  color: #ffffff;
  border-color: #b89742;
}
    </style>
</head>
<body>

    <header>
        <h1>YOSS COLLECTION</h1>
        <p>Catálogo Digital de Joyería</p>
    </header>

    <main>
  <p class="subtitulo">Elige tus Joyas Favoritas y envíanos tu pedido directo por WhatsApp.</p>
  
  <!-- BOTONES DE FILTRO (Varones, Mujeres, Niños) -->
  <div class="filtros-genero">
    <button class="btn-filtro activo" onclick="filtrarCatalogo('todos', this)">Todos</button>
    <button class="btn-filtro" onclick="filtrarCatalogo('varones', this)">Varones</button>
    <button class="btn-filtro" onclick="filtrarCatalogo('mujeres', this)">Mujeres</button>
    <button class="btn-filtro" onclick="filtrarCatalogo('niños', this)">Niños</button>
  </div>

  <!-- Contenedor vacío donde JavaScript pintará tus joyas dinámicamente -->
  <div id="contenedor-joyas" class="grid"></div>
</main>

    <script>
  // 1. CONFIGURACIÓN: Tu número de WhatsApp real (Mantenemos tu lógica)
  const MI_CELULAR = "51964525825"; 

  // Variable para almacenar el catálogo completo en memoria
  let todasLasJoyas = [];

  // Función para jalar los datos desde tu almacén joyas.json
  async function cargarCatalogo() {
    try {
      const respuesta = await fetch('joyas.json');
      todasLasJoyas = await respuesta.json();
      
      // Al iniciar el local, muestra todas las piezas
      mostrarProductos(todasLasJoyas);
    } catch (error) {
      console.error('Error al cargar el archivo de inventario:', error);
    }
  }

  // Función encargada de estructurar y pintar las tarjetas usando tus estilos CSS anteriores
  function mostrarProductos(listaProductos) {
    const contenedor = document.getElementById('contenedor-joyas');
    contenedor.innerHTML = ''; // Limpia las vitrinas antes de rellenar

    if (listaProductos.length === 0) {
      contenedor.innerHTML = <p style="grid-column: 1/-1; text-align: center; color: #777;">No hay joyas disponibles en esta categoría por ahora.</p>;
      return;
    }

    listaProductos.forEach(joya => {
      const tarjeta = document.createElement('div');
      tarjeta.className = 'card';

      // Estructuramos la tarjeta respetando al 100% tus clases CSS visuales
      tarjeta.innerHTML = `
        <div class="card-body">
          <span class="material">${joya.material} | ${joya.categoria}</span>
          <h3 class="nombre">${joya.nombre}</h3>
          <p class="desc">${joya.descripcion}</p>
          <div class="footer-card">
            <span class="precio">S/ ${joya.precio.toFixed(2)}</span>
            <button onclick="pedir('${joya.nombre}', '${joya.precio}')" class="btn">Pedir por WhatsApp</button>
          </div>
        </div>
      `;
      contenedor.appendChild(tarjeta);
    });
  }

  // Función para segmentar el catálogo al hacer clic en los botones
  function filtrarCatalogo(generoSeleccionado, botonPresionado) {
    // Quita la marca dorada de los otros botones y se la pone al seleccionado
    document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('activo'));
    botonPresionado.classList.add('activo');

    if (generoSeleccionado === 'todos') {
      mostrarProductos(todasLasJoyas);
    } else {
      const joyasFiltradas = todasLasJoyas.filter(joya => joya.genero === generoSeleccionado);
      mostrarProductos(joyasFiltradas);
    }
  }

  // 2. FUNCIÓN DE WHATSAPP (Mantenemos intacta tu fantástica lógica original)
  function pedir(nombre, precio) {
    let texto = encodeURIComponent("¡Hola Yoss Collection! Me interesa adquirir esta pieza: \n\n* " + nombre + "\n* Precio: S/ " + precio + "\n\n¿Tienen disponibilidad?");
    window.location.href = "https://wa.me" + MI_CELULAR + "?text=" + texto;
  }

  // Ejecuta la carga automática al abrir la tienda web
  document.addEventListener('DOMContentLoaded', cargarCatalogo);
</script>
</body>
</html>
